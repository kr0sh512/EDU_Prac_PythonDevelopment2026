[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordcount"
version = "0.1.0"
description = "Word counter with gettext i18n"
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
packages = ["wordcount"]

[tool.hatch.build.targets.sdist]
include = [
    "wordcount/",
    "po/",
    "pyproject.toml",
]
